
[workspace]
members = ["preconfirmation", "taiko-preconfer"]
resolver = "2"
[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
alloy = { version = "1.6.3", features = ["contract", "full", "json-rpc", "rpc-types-engine", "signer-local"] }
alloy-rlp = "0.3.13"
alloy-transport-http = { version = "1.6.3", features = ["hyper", "jwt-auth"] }

async-stream = "0.3.6"
c-kzg = "2.1.5"
dotenv = "0.15.0"
futures = "0.3.31"
hex = "0.4.3"
http-body-util = "0.1.3"
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
k256 = "0.13.4"
libdeflater = "1.25.2"
mockall = "0.14.0"
reqwest = { version = "0.13.2", features = ["json"] }
serde = "1.0.219"
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["full"] }
tokio-stream = { version = "0.1.18", features = ["time"] }
tower = "0.5.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
url = "2.5.8"

preconfirmation = { path = "./preconfirmation" }
